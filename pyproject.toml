[project]
name = "learnpulse"
version = "0.3.0"
description = "Early-warning and intervention copilot for school ERPs (prototype on synthetic data)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "lightgbm>=4.3",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["learnpulse"]

[tool.setuptools.package-data]
learnpulse = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
